<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .user-card, .task-form, .tasks-container {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            background: var(--tg-theme-bg-color, #ffffff);
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item.completed span {
            text-decoration: line-through;
            color: gray;
        }
        .task-item button {
            width: auto;
            padding: 5px 10px;
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>Мои Задачи</h2>

    <div class="user-card">
        <p><strong>ID:</strong> <span id="user-id">Загрузка...</span></p>
        <p><strong>Имя:</strong> <span id="first-name">Загрузка...</span></p>
    </div>

    <div class="task-form">
        <h3>Добавить задачу</h3>
        <input type="text" id="task-title" placeholder="Название задачи...">
        <input type="time" id="task-deadline">
        <button onclick="createTask()">Создать задачу</button>
    </div>

    <div class="tasks-container">
        <h3>Список задач</h3>
        <ul id="task-list" class="task-list">
            <p>Загрузка задач...</p>
        </ul>
    </div>

    <button id="close-btn">Закрыть приложение</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe?.user;
        const chatId = user ? user.id : 12345; 

        if (user) {
            document.getElementById('user-id').textContent = user.id;
            document.getElementById('first-name').textContent = user.first_name || 'Не указано';
        } else {
            document.getElementById('user-id').textContent = '12345 (Тестовый режим)';
            document.getElementById('first-name').textContent = 'Тестер';
        }

        async function fetchTasks() {
            try {
                const response = await fetch(`/api/tasks/${chatId}`);
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                console.error("Ошибка при загрузке задач:", error);
            }
        }

        function renderTasks(tasks) {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                listEl.innerHTML = '<p>Нет активных задач</p>';
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.is_completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div>
                        <strong>${task.title}</strong><br>
                        <small>Дедлайн: ${task.deadline}</small>
                    </div>
                    ${!task.is_completed 
                        ? `<button onclick="completeTask(${task.id})">Готово</button>` 
                        : '<span>✓</span>'}
                `;
                listEl.appendChild(li);
            });
        }

        async function createTask() {
            const title = document.getElementById('task-title').value.trim();
            const deadline = document.getElementById('task-deadline').value;

            if (!title || !deadline) {
                alert('Заполните название и время дедлайна!');
                return;
            }

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        deadline: deadline,
                        chat_id: chatId
                    })
                });

                if (response.ok) {
                    document.getElementById('task-title').value = '';
                    document.getElementById('task-deadline').value = '';
                    fetchTasks();
                } else {
                    alert('Ошибка при создании задачи');
                }
            } catch (error) {
                console.error("Ошибка сети:", error);
            }
        }

        async function completeTask(taskId) {
            try {
                const response = await fetch(`/api/tasks/${taskId}/complete`, {
                    method: 'POST'
                });

                if (response.ok) {
                    fetchTasks();
                }
            } catch (error) {
                console.error("Ошибка сети:", error);
            }
        }

        document.getElementById('close-btn').addEventListener('click', () => {
            tg.close();
        });

        fetchTasks();
    </script>
</body>
</html>
